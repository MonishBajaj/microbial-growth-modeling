{% extends "base.html" %}
{% block title %}Processing — Microbial Growth Analyzer{% endblock %}

{% block content %}
<div class="page-container">
    <div class="status-card">
        <h2 id="status-title">Running analysis…</h2>
        <p id="status-text" style="margin-top:0.5rem; color:var(--ink-muted);">
            Please wait while your job is processed.
        </p>

        <div class="progress-bar-wrapper">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="status-log" id="status-log">
            {% for log in logs %}
            <div class="log-line">{{ log }}</div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const taskId = "{{ task_id }}";
    const logEl = document.getElementById('status-log');
    const progressBar = document.getElementById('progress-bar');
    let progress = 10;

    function poll() {
        fetch(`/api/status/${taskId}`)
            .then(res => res.json())
            .then(data => {
                logEl.innerHTML = '';
                (data.logs || []).forEach(line => {
                    const div = document.createElement('div');
                    div.className = 'log-line';
                    div.textContent = line;
                    logEl.appendChild(div);
                });
                logEl.scrollTop = logEl.scrollHeight;

                if (progress < 90) progress += 3;
                progressBar.style.width = progress + '%';

                if (data.done) {
                    progressBar.style.width = '100%';
                    setTimeout(() => { window.location.reload(); }, 600);
                } else {
                    setTimeout(poll, 2000);
                }
            })
            .catch(() => {
                setTimeout(poll, 3000);
            });
    }

    poll();
</script>
{% endblock %}
